<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой профиль</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arsenal+SC:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <h1>Профиль</h1>
    </header>

    <div class="hover-background">
        <h2>Обо мне</h2>
        <p>Привет! Меня зовут Анастасия. Я студентка и в данный момент изучаю Git.</p>
    </div>

    <div class="hover-background">
            <fieldset>
            <legend>Контактные данные для связи</legend>
            <input type="email" placeholder="Ваш email" readonly value="anastasia@example.com">
            <button>Подписаться на новости</button>
        </fieldset>
    </div>

    <div class="hover-background">
        <h2>Вход через социальные сети</h2>
        
        <fieldset>
            <legend>Быстрый вход</legend>
            <p style="text-align: center;">Выберите удобный способ авторизации:</p>
            
            <button type="button">Войти через VK</button>
            <button type="button">Войти через Telegram</button>
            <button type="button">Войти через Google</button>
            
            <p style="text-align: center; font-size: 14px; margin-top: 15px;">
                * Это учебная форма. Реальная авторизация не происходит.
            </p>
        </fieldset>
    </div>

</body>
</html>
